name: Unfold PR map
description: Split every changed file into function blocks, tiered by who calls whom, and attach the map to the pull request.
inputs:
  base:
    description: Base ref to compare against
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Head ref with the changes
    default: ${{ github.event.pull_request.head.sha }}
  all:
    description: Show every function in changed files, not only changed ones and their neighbours
    default: "false"
  preview:
    description: >
      What the PR comment shows next to the link to the interactive map.
      "mermaid" (default) = call graph per file, "images" = screenshots of the map
      (opt-in; needs contents write and Chrome), "none" = summary and flags only.
    default: mermaid
  theme:
    description: Theme for screenshots when preview is "images" (dark or light)
    default: dark
  host:
    description: >
      Where the interactive map lives. "artifact" (default) = downloadable workflow artifact.
      "pages" = published to GitHub Pages at /pr-<number>/ and linked from the comment.
      Pages sites are PUBLIC except on GitHub Enterprise Cloud, and the map contains the
      changed files' full source, so only use "pages" on public repos or private Enterprise Pages.
      Needs contents: write and Pages set to deploy from the pages-branch.
    default: artifact
  pages-branch:
    description: Branch GitHub Pages serves from when host is "pages"
    default: unfold-pages
  images-branch:
    description: Branch that stores screenshots when preview is "images". Source branches are never touched.
    default: unfold-maps
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 20 }
    - if: github.event.action != 'closed'
      shell: bash
      run: npm ci --omit=dev --prefix "$GITHUB_ACTION_PATH"
    - id: map
      if: github.event.action != 'closed'
      shell: bash
      run: |
        ARGS=""; [ "${{ inputs.all }}" = "true" ] && ARGS="--all"
        if [ "${{ inputs.preview }}" = "images" ]; then
          export CHROME_PATH="${CHROME_PATH:-$(command -v google-chrome || command -v chromium || true)}"
          ARGS="$ARGS --png unfold-png --theme ${{ inputs.theme }}"
        fi
        node "$GITHUB_ACTION_PATH/bin/cli.js" "${{ inputs.base }}" "${{ inputs.head }}" $ARGS -o unfold.html --mermaid unfold.md 2> unfold.log || { cat unfold.log; exit 1; }
        cat unfold.log
    - id: upload
      if: github.event.action != 'closed'
      uses: actions/upload-artifact@v4
      with: { name: unfold-map, path: unfold.html }
    - id: images
      if: inputs.preview == 'images' && github.event.action != 'closed'
      shell: bash
      continue-on-error: true
      env:
        BRANCH: ${{ inputs.images-branch }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ inputs.head }}
      run: |
        [ -f unfold-png/manifest.json ] || { echo "no snapshots"; exit 1; }
        WT=$(mktemp -d)
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
          git worktree add --detach "$WT" FETCH_HEAD
          git -C "$WT" checkout -q -B "$BRANCH"
        else
          git worktree add --detach "$WT"
          git -C "$WT" checkout -q --orphan "$BRANCH"
          git -C "$WT" rm -rfq . || true
          printf '# Unfold map images\n\nGenerated by the Unfold PR workflow. Safe to delete.\n' > "$WT/README.md"
        fi
        DIR="pr-$PR/${SHA:0:12}"
        rm -rf "$WT/pr-$PR"            # keep only the latest push per PR
        mkdir -p "$WT/$DIR"
        cp unfold-png/*.png unfold-png/manifest.json "$WT/$DIR/"
        git -C "$WT" add -A
        git -C "$WT" commit -qm "Unfold maps for #$PR at ${SHA:0:12}"
        for i in 1 2 3; do
          git -C "$WT" push -q origin "HEAD:$BRANCH" && break
          git -C "$WT" fetch -q --depth=1 origin "$BRANCH" && git -C "$WT" rebase -q FETCH_HEAD || true
          sleep 2
        done
        echo "base=https://github.com/$GITHUB_REPOSITORY/blob/$BRANCH/$DIR" >> "$GITHUB_OUTPUT"
    - id: pages
      if: inputs.host == 'pages'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ inputs.pages-branch }}
        PR: ${{ github.event.pull_request.number }}
        CLOSED: ${{ github.event.action == 'closed' }}
      run: bash "$GITHUB_ACTION_PATH/bin/publish-pages.sh"
    - if: github.event.action != 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        URL: ${{ steps.upload.outputs.artifact-url }}
        IMAGE_BASE: ${{ steps.images.outputs.base }}
        MAP_URL: ${{ steps.pages.outputs.url }}
        PAGES_MISSING: ${{ steps.pages.outputs.pages_missing }}
      run: |
        ARGS=(--manifest unfold-png/manifest.json --artifact "$URL")
        [ -n "$MAP_URL" ] && ARGS+=(--map-url "$MAP_URL")
        [ "$PAGES_MISSING" = "true" ] && ARGS+=(--pages-missing "${{ inputs.pages-branch }}")
        [ "${{ inputs.preview }}" != "none" ] && ARGS+=(--fallback unfold.md)
        [ "${{ inputs.preview }}" = "none" ] && ARGS+=(--summary-only unfold.md)
        [ -n "$IMAGE_BASE" ] && ARGS+=(--image-base "$IMAGE_BASE")
        node "$GITHUB_ACTION_PATH/bin/comment.js" "${ARGS[@]}" > unfold-comment.md
        PR=${{ github.event.pull_request.number }}
        ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- unfold -->")) | .id' | head -1)
        if [ -n "$ID" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@unfold-comment.md >/dev/null
        else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@unfold-comment.md >/dev/null; fi
